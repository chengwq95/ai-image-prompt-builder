<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Lab</title>
<meta name="description" content="Build AI image prompts from four blocks: time, subject, scene and style.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316181D'/%3E%3Ccircle cx='24' cy='24' r='7' fill='%23F0B45E'/%3E%3Ccircle cx='40' cy='24' r='7' fill='%236CD0E0'/%3E%3Ccircle cx='24' cy='40' r='7' fill='%237FD6A0'/%3E%3Ccircle cx='40' cy='40' r='7' fill='%23D52B1E'/%3E%3C/svg%3E">
<script>
/* 尽早应用主题,避免闪烁(和视频提示词生成器共用设置) */
try { const th = localStorage.getItem("vpb.theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch(e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface-2:#FAF9F6;
  --line:#E7E3DA;
  --line-strong:#D6D1C6;
  --text:#1B1A18;
  --muted:#6E6A62;
  --faint:#9C978D;
  --accent:#D52B1E;
  --accent-ink:#FFFFFF;
  --on-text:#FFFFFF;
  --c-time:#A86200;
  --c-subject:#0B7F93;
  --c-scene:#2C8550;
  --c-style:#7A4BD6;
  --shadow:0 1px 2px rgba(27,26,24,.04),0 8px 24px -12px rgba(27,26,24,.08);
  --radius:14px;
  --sans:'Inter','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --display:'Outfit','Noto Sans SC',-apple-system,'PingFang SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,'Noto Sans SC',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E11;--surface:#15171B;--surface-2:#1A1D22;--line:#262931;--line-strong:#343844;
    --text:#ECEAE5;--muted:#9B9890;--faint:#6E6B65;--accent:#F0584C;--on-text:#0D0E11;
    --c-time:#F0B45E;--c-subject:#6CD0E0;--c-scene:#7FD6A0;--c-style:#B89CFF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E11;--surface:#15171B;--surface-2:#1A1D22;--line:#262931;--line-strong:#343844;
  --text:#ECEAE5;--muted:#9B9890;--faint:#6E6B65;--accent:#F0584C;--on-text:#0D0E11;
  --c-time:#F0B45E;--c-subject:#6CD0E0;--c-scene:#7FD6A0;--c-style:#B89CFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:230px;transition:background .3s,color .3s;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{width:28px;height:28px;flex:none}
.brand .logo-bg{fill:var(--text)}
.brand span{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px;align-items:center;flex:none}
.pill-link{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:12.5px;font-weight:500;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:7px 12px;transition:border-color .2s;
}
.pill-link:hover{border-color:var(--text)}
.pill-link svg{width:14px;height:14px}
.switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.switch button{
  display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--muted);padding:5px 11px;border-radius:99px;
  transition:background .2s,color .2s;
}
.switch button:hover{color:var(--text)}
.switch button[aria-pressed="true"]{background:var(--text);color:var(--on-text)}
.switch svg{width:14px;height:14px;flex:none}
@media(max-width:720px){.pill-link .lbl{display:none}.pill-link{padding:7px 9px}}
@media(max-width:560px){
  .switch .lbl{display:none}
  .switch button{padding:5px 9px}
  .brand span{font-size:14px}
}

/* ---------- hero ---------- */
.hero{padding-top:64px;padding-bottom:36px}
@media(max-width:640px){.hero{padding-top:40px}}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--line-strong)}
h1{
  font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,72px);
  line-height:1.02;letter-spacing:-.035em;margin-bottom:20px;max-width:15ch;
}
[lang=zh-CN] h1{font-weight:700;letter-spacing:0;line-height:1.15;max-width:none}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);max-width:620px;font-size:16.5px;line-height:1.65}

.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:30px 0 8px}
.f-block{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:17px;
  padding:10px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  transition:transform .15s,border-color .15s;
}
.f-block i{width:9px;height:9px;border-radius:50%}
.f-block:hover{transform:translateY(-2px)}
.f-block[data-cat="time"]:hover{border-color:var(--c-time)}
.f-block[data-cat="subject"]:hover{border-color:var(--c-subject)}
.f-block[data-cat="scene"]:hover{border-color:var(--c-scene)}
.f-block[data-cat="style"]:hover{border-color:var(--c-style)}
.f-plus{color:var(--faint);font-size:18px}
.formula-note{font-size:13px;color:var(--muted)}
.formula-note b{color:var(--text);font-weight:600}

/* ---------- intro cards ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 36px}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;cursor:pointer;text-align:left;box-shadow:var(--shadow);
  transition:border-color .15s,transform .15s;
}
.card:hover{transform:translateY(-2px)}
.card h3{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.card .dot{width:9px;height:9px;border-radius:50%;flex:none}
.card p{font-size:12.5px;color:var(--muted);line-height:1.55}
.card[data-cat="time"]:hover{border-color:var(--c-time)}
.card[data-cat="subject"]:hover{border-color:var(--c-subject)}
.card[data-cat="scene"]:hover{border-color:var(--c-scene)}
.card[data-cat="style"]:hover{border-color:var(--c-style)}

/* ---------- quick start + presets ---------- */
.quick{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px 24px;margin-bottom:36px;
}
@media(max-width:640px){.quick{padding:18px 16px}}
.quick h2,.section-head h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.quick > p{font-size:13px;color:var(--muted);margin:2px 0 16px}
.quick-steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media(max-width:820px){.quick-steps{grid-template-columns:1fr}}
.quick-steps li{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.quick-steps .n{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);
}
.quick-steps strong{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.quick-steps p{font-size:12.5px;color:var(--muted);line-height:1.5}
.sub-label{
  font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:0 0 12px;display:flex;align-items:center;gap:12px;
}
.sub-label::after{content:"";flex:1;height:1px;background:var(--line)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap}
.preset,.btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-size:13.5px;font-weight:500;border-radius:99px;padding:8px 15px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  transition:background .2s,border-color .2s,transform .1s;
}
.preset:hover,.btn:hover{border-color:var(--text)}
.preset:active,.btn:active{transform:translateY(1px)}
.preset span{color:var(--faint);font-size:12px}
.preset.active{background:var(--text);color:var(--on-text);border-color:var(--text)}
.preset.active span{color:inherit;opacity:.7}
.btn.dice{border-style:dashed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn svg{width:15px;height:15px}
.preset-note{
  margin-top:14px;padding:12px 16px;font-size:13.5px;line-height:1.7;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
}
.preset-note b{color:var(--text);font-weight:600}

/* ---------- builder ---------- */
.section-head{display:flex;align-items:baseline;gap:14px;margin:0 0 16px;flex-wrap:wrap;scroll-margin-top:76px}
.section-head .no{font-family:var(--mono);font-size:12px;color:var(--faint)}
.section-head p{margin-left:auto;font-size:13px;color:var(--muted)}
@media(max-width:640px){.section-head p{margin-left:0;flex-basis:100%}}
.builder{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:40px;
}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{
  flex:1;min-width:104px;font-size:14.5px;font-weight:600;padding:15px 8px;
  background:transparent;border:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
  display:inline-flex;justify-content:center;align-items:center;gap:8px;
}
.tab:hover{color:var(--text)}
.tab:focus-visible{outline-offset:-3px}
.tab .cnt{
  min-width:20px;font-family:var(--mono);font-size:11px;font-weight:500;border-radius:99px;
  padding:1px 6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
}
.tab.active{color:var(--text)}
.tab.active[data-cat="time"]{border-bottom-color:var(--c-time)}
.tab.active[data-cat="subject"]{border-bottom-color:var(--c-subject)}
.tab.active[data-cat="scene"]{border-bottom-color:var(--c-scene)}
.tab.active[data-cat="style"]{border-bottom-color:var(--c-style)}

.pane{display:none;padding:22px 24px 12px}
.pane.active{display:block}
@media(max-width:640px){.pane{padding:18px 16px 8px}}
.pane-tip{
  font-size:13px;color:var(--muted);margin-bottom:20px;padding:11px 14px;line-height:1.6;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
}
.pane-tip b{color:var(--text);font-weight:600}
.subgroup-title{
  font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 12px;padding-top:18px;border-top:1px solid var(--line);
}
.subgroup-title:first-of-type{margin-top:0;border-top:none;padding-top:0}
.dim{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}
.dim-label{flex:none;width:112px;font-size:12.5px;font-weight:500;color:var(--muted);padding-top:7px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:13.5px;color:var(--text);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;
  transition:border-color .12s,background .12s,color .12s;
}
.chip:hover{border-color:var(--line-strong)}
.chip.on{font-weight:600;color:#fff}
.chip.on[data-cat="time"]{background:var(--c-time);border-color:var(--c-time)}
.chip.on[data-cat="subject"]{background:var(--c-subject);border-color:var(--c-subject)}
.chip.on[data-cat="scene"]{background:var(--c-scene);border-color:var(--c-scene)}
.chip.on[data-cat="style"]{background:var(--c-style);border-color:var(--c-style)}
:root[data-theme="dark"] .chip.on{color:#0D0E11}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#0D0E11}}
.custom-row{display:flex;gap:8px;margin:8px 0 16px;padding-left:128px}
@media(max-width:640px){
  .dim{flex-direction:column;gap:6px}
  .dim-label{width:auto;text-align:left;padding-top:0}
  .custom-row{padding-left:0}
}
.custom-row input{
  font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;flex:1;max-width:320px;min-width:0;
}
.custom-row input:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.custom-row .btn{padding:7px 14px;font-size:13px}

/* ---------- checklist ---------- */
.dg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.dg-grid{grid-template-columns:1fr}}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:13px;box-shadow:var(--shadow)}
.dg b{display:block;font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px}
.dg p{color:var(--muted);line-height:1.6}
.dg em{font-style:normal;color:var(--text);font-weight:600}

.promo{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:36px;
  padding:18px 20px;border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  background:color-mix(in srgb,var(--accent) 6%,var(--surface));
}
.promo b{font-family:var(--display);font-size:17px;font-weight:600;display:block}
.promo p{font-size:13px;color:var(--muted)}

footer{border-top:1px solid var(--line);margin-top:48px;padding:26px 0 36px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line-strong)}

/* ---------- viewfinder ---------- */
.viewfinder{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);
}
.vf-inner{max-width:1080px;margin:0 auto;padding:12px 28px 14px}
@media(max-width:640px){.vf-inner{padding:10px 12px 12px}}
.vf-frame{
  position:relative;border-radius:12px;padding:12px 16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.vf-frame::before,.vf-frame::after,.vf-corner::before,.vf-corner::after{
  content:"";position:absolute;width:14px;height:14px;border-color:var(--faint);border-style:solid;
}
.vf-frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:12px 0 0 0}
.vf-frame::after{top:-1px;right:-1px;border-width:2px 2px 0 0;border-radius:0 12px 0 0}
.vf-corner::before{bottom:-1px;left:-1px;border-width:0 0 2px 2px;border-radius:0 0 0 12px}
.vf-corner::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 12px 0}
.vf-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.vf-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rec{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none;transition:background .2s}
.rec.live{background:var(--accent);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.meter{display:flex;gap:12px}
.m-dot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint)}
.m-dot i{width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid var(--line-strong);flex:none}
.m-dot.ok{color:var(--text)}
.m-dot.ok[data-cat="time"] i{background:var(--c-time);border-color:var(--c-time)}
.m-dot.ok[data-cat="subject"] i{background:var(--c-subject);border-color:var(--c-subject)}
.m-dot.ok[data-cat="scene"] i{background:var(--c-scene);border-color:var(--c-scene)}
.m-dot.ok[data-cat="style"] i{background:var(--c-style);border-color:var(--c-style)}
@media(max-width:640px){.m-dot span{display:none}.meter{gap:7px}}
.vf-prompt{
  font-family:var(--mono);font-size:13.5px;line-height:1.75;min-height:26px;max-height:96px;overflow-y:auto;
  word-break:break-word;
}
.vf-empty{color:var(--muted);font-family:var(--sans);font-size:13.5px}
.seg-time{color:var(--c-time)}
.seg-subject{color:var(--c-subject)}
.seg-scene{color:var(--c-scene)}
.seg-style{color:var(--c-style)}
.seg-comma{color:var(--faint)}
.vf-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}
.vf-actions .right{display:flex;gap:8px}
.plang{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.plang .switch button{padding:3px 10px;font-size:12px}

.toast{
  position:fixed;left:50%;bottom:220px;transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--on-text);font-size:13px;font-weight:500;
  padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;box-shadow:var(--shadow);
  transition:opacity .25s,transform .25s;z-index:60;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#top" aria-label="Prompt Lab">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect class="logo-bg" width="64" height="64" rx="16"/><circle cx="24" cy="24" r="7" fill="var(--c-time)"/><circle cx="40" cy="24" r="7" fill="var(--c-subject)"/><circle cx="24" cy="40" r="7" fill="var(--c-scene)"/><circle cx="40" cy="40" r="7" fill="var(--accent)"/></svg>
      <span data-i18n="brand"></span>
    </a>

      <a class="pill-link" href="https://chengwq95.github.io/ai-video-prompt-builder/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg><span class="lbl" data-i18n="videoLink"></span></a>

/* ================= 状态与存储 ================= */
const LS_STATE = "promptlab.image.v1";
const LS_LANG = "vpb.lang";       // 和视频提示词生成器共用
const LS_THEME = "vpb.theme";
const LS_PLANG = "promptlab.plang";

let lang = "en", plang = "en";
try { if (localStorage.getItem(LS_LANG) === "zh") lang = "zh"; } catch(e) {}
try { if (localStorage.getItem(LS_PLANG) === "zh") plang = "zh"; } catch(e) {}
function t(k) { return I18N[lang][k]; }
const L = pair => pair[lang === "zh" ? 0 : 1];

// 每个类别是一个有序数组:内置词用中文 id,自定义词以 "c:" 开头
let state = { time:[], subject:[], scene:[], style:[] };
try {
  const raw = JSON.parse(localStorage.getItem(LS_STATE));
  if (raw) CATS.forEach(c => { if (Array.isArray(raw[c])) state[c] = raw[c]; });
} catch(e) {}
function saveState() { try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch(e) {} }

function wordText(id, inLang) {
  if (id.startsWith("c:")) return id.slice(2);
  return inLang === "zh" ? id : (EN[id] || id);
}

/* ================= 渲染面板 ================= */
function renderPanes() {
  CATS.forEach(cat => {
    const pane = document.querySelector(`.pane[data-pane="${cat}"]`);
    const d = DATA[cat];
    let html = `<div class="pane-tip">${d.tip[lang]}</div>`;
    d.groups.forEach(g => {
      if (g.title) html += `<div class="subgroup-title">${L(g.title)}</div>`;
      g.dims.forEach(dim => {
        html += `<div class="dim"><div class="dim-label">${L(dim.label)}</div><div class="chips">`;
        dim.chips.forEach(([zh, en]) => {
          html += `<button type="button" class="chip" data-cat="${cat}" data-word="${escapeHtml(zh)}" aria-pressed="false">${escapeHtml(lang === "zh" ? zh : en)}</button>`;
        });
        html += `</div></div>`;
      });
    });
    const ph = t("customPh").replace("{cat}", t("cat")[cat].toLowerCase());
    html += `<div class="custom-row">
      <input type="text" maxlength="40" placeholder="${escapeHtml(ph)}" data-input="${cat}" aria-label="${escapeHtml(ph)}">
      <button type="button" class="btn" data-add="${cat}">${t("add")}</button>
    </div>`;
    pane.innerHTML = html;
  });
}

function renderPresets() {
  document.getElementById("presetRow").innerHTML =
    PRESETS.map((p, i) => `<button type="button" class="preset" data-preset="${i}">${L(p.name)} <span>${L(p.tag)}</span></button>`).join("") +
    `<button type="button" class="btn dice" id="randomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/></svg>${t("random")}</button>`;
  if (activePreset !== null) showPresetNote(activePreset);
}

/* ================= 交互 ================= */
let activePreset = null;

function toggleWord(cat, word) {
  const arr = state[cat];
  const i = arr.indexOf(word);
  if (i >= 0) arr.splice(i, 1);
  else arr.push(word);
  render();
}

document.getElementById("builder").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { toggleWord(chip.dataset.cat, chip.dataset.word); return; }
  const add = e.target.closest("[data-add]");
  if (add) addCustom(add.dataset.add);
});
document.getElementById("builder").addEventListener("keydown", e => {
  const inp = e.target.closest("[data-input]");
  if (inp && e.key === "Enter") addCustom(inp.dataset.input);
});

function addCustom(cat) {
  const inp = document.querySelector(`[data-input="${cat}"]`);
  const w = inp.value.trim();
  if (!w) return;
  const id = "c:" + w;
  if (!state[cat].includes(id)) state[cat].push(id);
  inp.value = "";
  render();
}

/* tabs */
const tabs = document.querySelectorAll(".tab");
function switchTab(cat) {
  tabs.forEach(tb => {
    const on = tb.dataset.cat === cat;
    tb.classList.toggle("active", on);
    tb.setAttribute("aria-selected", on);
  });
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.dataset.pane === cat));
}
tabs.forEach(tb => tb.addEventListener("click", () => switchTab(tb.dataset.cat)));

/* 公式块 & 卡片跳转 */
document.querySelectorAll("[data-jump]").forEach(el => {
  el.addEventListener("click", () => {
    switchTab(el.dataset.jump);
    document.getElementById("builderHead").scrollIntoView({behavior:"smooth", block:"start"});
  });
});

/* presets */
function showPresetNote(i) {
  document.querySelectorAll(".preset").forEach(b => b.classList.toggle("active", +b.dataset.preset === i));
  const note = document.getElementById("presetNote");
  note.innerHTML = PRESETS[i].note[lang];
  note.hidden = false;
}
document.getElementById("presetRow").addEventListener("click", e => {
  const btn = e.target.closest(".preset");
  if (btn) {
    activePreset = +btn.dataset.preset;
    const p = PRESETS[activePreset];
    CATS.forEach(c => state[c] = [...p[c]]);
    render();
    showPresetNote(activePreset);
    switchTab("subject");
    return;
  }
  if (e.target.closest("#randomBtn")) randomIdea();
});

function clearPresetNote() {
  activePreset = null;
  document.querySelectorAll(".preset").forEach(b => b.classList.remove("active"));
  document.getElementById("presetNote").hidden = true;
}

/* 随机灵感:每个类别抽 1-2 个词 */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomIdea() {
  clearPresetNote();
  CATS.forEach(c => state[c] = []);
  // time: 抽一个时刻
  state.time.push(pick(DATA.time.groups[0].dims[2].chips)[0]);
  // subject: 随机选一个子类,抽前两维各一个词
  const g = pick(DATA.subject.groups);
  state.subject.push(pick(g.dims[0].chips)[0]);
  state.subject.push(pick(g.dims[1].chips)[0]);
  // scene: 自然或建筑抽一个 + 天气一个
  const sDims = DATA.scene.groups[0].dims;
  state.scene.push(pick(pick([sDims[0], sDims[1]]).chips)[0]);
  state.scene.push(pick(sDims[2].chips)[0]);
  // style: 画面风格/色调/光源/景别 各一个
  const st = DATA.style.groups[0].dims;
  [0,2,3,4].forEach(i => state.style.push(pick(st[i].chips)[0]));
  render();
}

/* clear & copy */
document.getElementById("clearBtn").addEventListener("click", () => {
  clearPresetNote();
  CATS.forEach(c => state[c] = []);
  render();
});

function promptText() {
  const sep = plang === "zh" ? "," : ", ";
  return CATS.flatMap(c => state[c].map(w => wordText(w, plang))).join(sep);
}

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = promptText();
  if (!text) { showToast(t("pickFirst")); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast(t("copied"));
  } catch (err) {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast(t("copied")); }
    catch(e) { showToast(t("copyFail")); }
    document.body.removeChild(ta);
  }
});

let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ================= 渲染输出 ================= */
function render() {
  saveState();
  // chips 高亮
  document.querySelectorAll(".chip").forEach(btn => {
    const on = state[btn.dataset.cat].includes(btn.dataset.word);
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on);
  });
  // 计数
  CATS.forEach(c => { document.querySelector(`[data-cnt="${c}"]`).textContent = state[c].length; });
  // 完整度
  document.querySelectorAll(".m-dot").forEach(d => d.classList.toggle("ok", state[d.dataset.cat].length > 0));
  // REC 灯
  const total = CATS.reduce((n, c) => n + state[c].length, 0);
  document.getElementById("rec").classList.toggle("live", total > 0);
  // 提示词
  const out = document.getElementById("promptOut");
  if (total === 0) {
    out.innerHTML = `<span class="vf-empty">${t("empty")}</span>`;
    return;
  }
  const comma = plang === "zh" ? "," : ", ";
  const parts = [];
  CATS.forEach(c => state[c].forEach(w => parts.push(`<span class="seg-${c}">${escapeHtml(wordText(w, plang))}</span>`)));
  out.innerHTML = parts.join(`<span class="seg-comma">${comma}</span>`);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ================= 语言 ================= */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-cat-name]").forEach(el => { el.textContent = t("cat")[el.dataset.catName]; });
  document.querySelectorAll("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.langBtn === lang));
  renderPanes();
  renderPresets();
  render();
}
document.querySelectorAll("[data-lang-btn]").forEach(b => b.addEventListener("click", () => {
  if (lang === b.dataset.langBtn) return;
  lang = b.dataset.langBtn;
  try { localStorage.setItem(LS_LANG, lang); } catch(e) {}
  applyLang();
}));

/* 提示词语言:可以和界面语言不同(大多数工具用英文效果更好) */
function syncPlang() {
  document.querySelectorAll("[data-plang-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.plangBtn === plang));
}
document.querySelectorAll("[data-plang-btn]").forEach(b => b.addEventListener("click", () => {
  plang = b.dataset.plangBtn;
  try { localStorage.setItem(LS_PLANG, plang); } catch(e) {}
  syncPlang();
  render();
}));

/* ================= 日间 / 夜间 ================= */
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function currentTheme() {
  return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
}
function syncThemeButtons() {
  const th = currentTheme();
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === th));
}
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn;
  try { localStorage.setItem(LS_THEME, b.dataset.themeBtn); } catch(e) {}
  syncThemeButtons();
}));
darkQuery.addEventListener("change", syncThemeButtons);
syncThemeButtons();
syncPlang();
applyLang();
</script>

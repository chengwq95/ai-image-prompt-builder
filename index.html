<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Prompt Builder</title>
<meta name="description" content="Build AI image prompts from four blocks: time, subject, scene and style.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316181D'/%3E%3Ccircle cx='24' cy='24' r='7' fill='%23F0B45E'/%3E%3Ccircle cx='40' cy='24' r='7' fill='%236CD0E0'/%3E%3Ccircle cx='24' cy='40' r='7' fill='%237FD6A0'/%3E%3Ccircle cx='40' cy='40' r='7' fill='%23D52B1E'/%3E%3C/svg%3E">
<script>
/* 尽早应用主题,避免闪烁(和视频提示词生成器共用设置) */
try { const th = localStorage.getItem("vpb.theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch(e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface-2:#FAF9F6;
  --line:#E7E3DA;
  --line-strong:#D6D1C6;
  --text:#1B1A18;
  --muted:#6E6A62;
  --faint:#9C978D;
  --accent:#D52B1E;
  --accent-ink:#FFFFFF;
  --on-text:#FFFFFF;
  --c-time:#A86200;
  --c-subject:#0B7F93;
  --c-scene:#2C8550;
  --c-style:#7A4BD6;
  --shadow:0 1px 2px rgba(27,26,24,.04),0 8px 24px -12px rgba(27,26,24,.08);
  --radius:14px;
  --sans:'Inter','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --display:'Outfit','Noto Sans SC',-apple-system,'PingFang SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,'Noto Sans SC',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E11;--surface:#15171B;--surface-2:#1A1D22;--line:#262931;--line-strong:#343844;
    --text:#ECEAE5;--muted:#9B9890;--faint:#6E6B65;--accent:#F0584C;--on-text:#0D0E11;
    --c-time:#F0B45E;--c-subject:#6CD0E0;--c-scene:#7FD6A0;--c-style:#B89CFF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E11;--surface:#15171B;--surface-2:#1A1D22;--line:#262931;--line-strong:#343844;
  --text:#ECEAE5;--muted:#9B9890;--faint:#6E6B65;--accent:#F0584C;--on-text:#0D0E11;
  --c-time:#F0B45E;--c-subject:#6CD0E0;--c-scene:#7FD6A0;--c-style:#B89CFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:230px;transition:background .3s,color .3s;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{width:28px;height:28px;flex:none}
.brand .logo-bg{fill:var(--text)}
.brand span{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px;align-items:center;flex:none}
.pill-link{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:12.5px;font-weight:500;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:7px 12px;transition:border-color .2s;
}
.pill-link:hover{border-color:var(--text)}
.pill-link svg{width:14px;height:14px}
.switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.switch button{
  display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--muted);padding:5px 11px;border-radius:99px;
  transition:background .2s,color .2s;
}
.switch button:hover{color:var(--text)}
.switch button[aria-pressed="true"]{background:var(--text);color:var(--on-text)}
.switch svg{width:14px;height:14px;flex:none}
@media(max-width:720px){.pill-link .lbl{display:none}.pill-link{padding:7px 9px}}
@media(max-width:560px){
  .switch .lbl{display:none}
  .switch button{padding:5px 9px}
  .brand span{font-size:14px}
}

/* ---------- hero ---------- */
.hero{padding-top:64px;padding-bottom:36px}
@media(max-width:640px){.hero{padding-top:40px}}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--line-strong)}
h1{
  font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,72px);
  line-height:1.02;letter-spacing:-.035em;margin-bottom:20px;max-width:15ch;
}
[lang=zh-CN] h1{font-weight:700;letter-spacing:0;line-height:1.15;max-width:none}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);max-width:620px;font-size:16.5px;line-height:1.65}

.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:30px 0 8px}
.f-block{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:17px;
  padding:10px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  transition:transform .15s,border-color .15s;
}
.f-block i{width:9px;height:9px;border-radius:50%}
.f-block:hover{transform:translateY(-2px)}
.f-block[data-cat="time"]:hover{border-color:var(--c-time)}
.f-block[data-cat="subject"]:hover{border-color:var(--c-subject)}
.f-block[data-cat="scene"]:hover{border-color:var(--c-scene)}
.f-block[data-cat="style"]:hover{border-color:var(--c-style)}
.f-plus{color:var(--faint);font-size:18px}
.formula-note{font-size:13px;color:var(--muted)}
.formula-note b{color:var(--text);font-weight:600}

/* ---------- intro cards ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 36px}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;cursor:pointer;text-align:left;box-shadow:var(--shadow);
  transition:border-color .15s,transform .15s;
}
.card:hover{transform:translateY(-2px)}
.card h3{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.card .dot{width:9px;height:9px;border-radius:50%;flex:none}
.card p{font-size:12.5px;color:var(--muted);line-height:1.55}
.card[data-cat="time"]:hover{border-color:var(--c-time)}
.card[data-cat="subject"]:hover{border-color:var(--c-subject)}
.card[data-cat="scene"]:hover{border-color:var(--c-scene)}
.card[data-cat="style"]:hover{border-color:var(--c-style)}

/* ---------- quick start + presets ---------- */
.quick{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px 24px;margin-bottom:36px;
}
@media(max-width:640px){.quick{padding:18px 16px}}
.quick h2,.section-head h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.quick > p{font-size:13px;color:var(--muted);margin:2px 0 16px}
.quick-steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media(max-width:820px){.quick-steps{grid-template-columns:1fr}}
.quick-steps li{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.quick-steps .n{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);
}
.quick-steps strong{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.quick-steps p{font-size:12.5px;color:var(--muted);line-height:1.5}
.sub-label{
  font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:0 0 12px;display:flex;align-items:center;gap:12px;
}
.sub-label::after{content:"";flex:1;height:1px;background:var(--line)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap}
.preset,.btn{text-decoration:none;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-size:13.5px;font-weight:500;border-radius:99px;padding:8px 15px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  transition:background .2s,border-color .2s,transform .1s;
}
.preset:hover,.btn:hover{border-color:var(--text)}
.preset:active,.btn:active{transform:translateY(1px)}
.preset span{color:var(--faint);font-size:12px}
.preset.active{background:var(--text);color:var(--on-text);border-color:var(--text)}
.preset.active span{color:inherit;opacity:.7}
.btn.dice{border-style:dashed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn svg{width:15px;height:15px}
.preset-note{
  margin-top:14px;padding:12px 16px;font-size:13.5px;line-height:1.7;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
}
.preset-note b{color:var(--text);font-weight:600}

/* ---------- builder ---------- */
.section-head{display:flex;align-items:baseline;gap:14px;margin:0 0 16px;flex-wrap:wrap;scroll-margin-top:76px}
.section-head .no{font-family:var(--mono);font-size:12px;color:var(--faint)}
.section-head p{margin-left:auto;font-size:13px;color:var(--muted)}
@media(max-width:640px){.section-head p{margin-left:0;flex-basis:100%}}
.builder{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:40px;
}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{
  flex:1;min-width:104px;font-size:14.5px;font-weight:600;padding:15px 8px;
  background:transparent;border:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
  display:inline-flex;justify-content:center;align-items:center;gap:8px;
}
.tab:hover{color:var(--text)}
.tab:focus-visible{outline-offset:-3px}
.tab .cnt{
  min-width:20px;font-family:var(--mono);font-size:11px;font-weight:500;border-radius:99px;
  padding:1px 6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
}
.tab.active{color:var(--text)}
.tab.active[data-cat="time"]{border-bottom-color:var(--c-time)}
.tab.active[data-cat="subject"]{border-bottom-color:var(--c-subject)}
.tab.active[data-cat="scene"]{border-bottom-color:var(--c-scene)}
.tab.active[data-cat="style"]{border-bottom-color:var(--c-style)}

.pane{display:none;padding:22px 24px 12px}
.pane.active{display:block}
@media(max-width:640px){.pane{padding:18px 16px 8px}}
.pane-tip{
  font-size:13px;color:var(--muted);margin-bottom:20px;padding:11px 14px;line-height:1.6;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
}
.pane-tip b{color:var(--text);font-weight:600}
.subgroup-title{
  font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 12px;padding-top:18px;border-top:1px solid var(--line);
}
.subgroup-title:first-of-type{margin-top:0;border-top:none;padding-top:0}
.dim{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}
.dim-label{flex:none;width:112px;font-size:12.5px;font-weight:500;color:var(--muted);padding-top:7px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:13.5px;color:var(--text);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;
  transition:border-color .12s,background .12s,color .12s;
}
.chip:hover{border-color:var(--line-strong)}
.chip.on{font-weight:600;color:#fff}
.chip.on[data-cat="time"]{background:var(--c-time);border-color:var(--c-time)}
.chip.on[data-cat="subject"]{background:var(--c-subject);border-color:var(--c-subject)}
.chip.on[data-cat="scene"]{background:var(--c-scene);border-color:var(--c-scene)}
.chip.on[data-cat="style"]{background:var(--c-style);border-color:var(--c-style)}
:root[data-theme="dark"] .chip.on{color:#0D0E11}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#0D0E11}}
.custom-row{display:flex;gap:8px;margin:8px 0 16px;padding-left:128px}
@media(max-width:640px){
  .dim{flex-direction:column;gap:6px}
  .dim-label{width:auto;text-align:left;padding-top:0}
  .custom-row{padding-left:0}
}
.custom-row input{
  font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;flex:1;max-width:320px;min-width:0;
}
.custom-row input:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.custom-row .btn{padding:7px 14px;font-size:13px}

/* ---------- checklist ---------- */
.dg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.dg-grid{grid-template-columns:1fr}}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:13px;box-shadow:var(--shadow)}
.dg b{display:block;font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px}
.dg p{color:var(--muted);line-height:1.6}
.dg em{font-style:normal;color:var(--text);font-weight:600}

.promo{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:36px;
  padding:18px 20px;border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  background:color-mix(in srgb,var(--accent) 6%,var(--surface));
}
.promo b{font-family:var(--display);font-size:17px;font-weight:600;display:block}
.promo p{font-size:13px;color:var(--muted)}

footer{border-top:1px solid var(--line);margin-top:48px;padding:26px 0 36px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line-strong)}

/* ---------- viewfinder ---------- */
.viewfinder{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);
}
.vf-inner{max-width:1080px;margin:0 auto;padding:12px 28px 14px}
@media(max-width:640px){.vf-inner{padding:10px 12px 12px}}
.vf-frame{
  position:relative;border-radius:12px;padding:12px 16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.vf-frame::before,.vf-frame::after,.vf-corner::before,.vf-corner::after{
  content:"";position:absolute;width:14px;height:14px;border-color:var(--faint);border-style:solid;
}
.vf-frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:12px 0 0 0}
.vf-frame::after{top:-1px;right:-1px;border-width:2px 2px 0 0;border-radius:0 12px 0 0}
.vf-corner::before{bottom:-1px;left:-1px;border-width:0 0 2px 2px;border-radius:0 0 0 12px}
.vf-corner::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 12px 0}
.vf-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.vf-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rec{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none;transition:background .2s}
.rec.live{background:var(--accent);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.meter{display:flex;gap:12px}
.m-dot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint)}
.m-dot i{width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid var(--line-strong);flex:none}
.m-dot.ok{color:var(--text)}
.m-dot.ok[data-cat="time"] i{background:var(--c-time);border-color:var(--c-time)}
.m-dot.ok[data-cat="subject"] i{background:var(--c-subject);border-color:var(--c-subject)}
.m-dot.ok[data-cat="scene"] i{background:var(--c-scene);border-color:var(--c-scene)}
.m-dot.ok[data-cat="style"] i{background:var(--c-style);border-color:var(--c-style)}
@media(max-width:640px){.m-dot span{display:none}.meter{gap:7px}}
.vf-prompt{
  font-family:var(--mono);font-size:13.5px;line-height:1.75;min-height:26px;max-height:96px;overflow-y:auto;
  word-break:break-word;
}
.vf-empty{color:var(--muted);font-family:var(--sans);font-size:13.5px}
.seg-time{color:var(--c-time)}
.seg-subject{color:var(--c-subject)}
.seg-scene{color:var(--c-scene)}
.seg-style{color:var(--c-style)}
.seg-3d{text-decoration:underline dotted;text-underline-offset:3px}
.chip.by3d{opacity:.45;text-decoration:line-through}
.seg-comma{color:var(--faint)}
.vf-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}
.vf-actions .right{display:flex;gap:8px}
.plang{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.plang .switch button{padding:3px 10px;font-size:12px}

/* ---------- guided tour ---------- */
.guide-btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:7px 12px;transition:border-color .2s;
}
.guide-btn:hover{border-color:var(--text)}
.guide-btn svg{width:14px;height:14px}
@media(max-width:720px){.guide-btn .lbl{display:none}.guide-btn{padding:7px 9px}}
.quick-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.quick-head p{font-size:13px;color:var(--muted);margin-top:2px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.pulse{animation:pulse 1.8s ease-out infinite}
.tour{position:fixed;inset:0;z-index:100}
.tour[hidden]{display:none}
.tour.no-target{background:rgba(10,10,12,.55)}
.tour-spot{
  position:fixed;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 2px var(--accent),0 0 0 9999px rgba(10,10,12,.55);
  transition:left .3s,top .3s,width .3s,height .3s;
}

<script>
/* ================= 3D 镜头与姿势(Camera & Pose Studio) =================
   A small 3D studio drawn on <canvas>, no libraries: drag the handles to set the camera angle,
   pose a mannequin, and get the matching prompt words. Shared by the image and video builders.
   Coordinates: metres, y up; the character faces +z, so its right hand is on -x. */
const CamPose = (() => {
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- tiny vector / matrix helpers (3x3 rotation matrices as flat arrays) ---------- */
  const v = (x, y, z) => [x, y, z];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const rx = d => { const c = Math.cos(d * D2R), s = Math.sin(d * D2R); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const ry = d => { const c = Math.cos(d * D2R), s = Math.sin(d * D2R); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const rz = d => { const c = Math.cos(d * D2R), s = Math.sin(d * D2R); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
  const mm = (a, b) => {
    const o = new Array(9);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
    return o;
  };
  const mv = (m, p) => [m[0] * p[0] + m[1] * p[1] + m[2] * p[2], m[3] * p[0] + m[4] * p[1] + m[5] * p[2], m[6] * p[0] + m[7] * p[1] + m[8] * p[2]];
  const chain = (...ms) => ms.reduce(mm);

  /* ---------- pose model ---------- */
  // Arm: raise = out to the side (0 down, 90 level, 180 overhead), fwd = forward (negative: behind),
  // bend = elbow. Leg: fwd = hip forward, side = out to the side, bend = knee.
  const limb = (a = 0, b = 0, c = 0, d = 0) => ({ a, b, c, d });
  const BASE = () => ({
    yaw: 0, lean: 0, side: 0, headYaw: 0, headPitch: 0, headTilt: 0, seated: false,
    lArm: limb(8, 0, 10), rArm: limb(8, 0, 10), lLeg: limb(0, 4, 0), rLeg: limb(0, 4, 0)
  });
  const P = (o) => Object.assign(BASE(), o);

  const PRESETS = [
    { id: "stand", zh: "自然站立", en: "Standing", say: ["自然站立,双手垂放身侧", "standing relaxed with arms at the sides"], pose: P({}) },
    { id: "hips", zh: "双手叉腰", en: "Hands on hips", say: ["站立,双手叉腰", "standing with hands on hips"], pose: P({ lArm: limb(55, -10, 110, 80), rArm: limb(55, -10, 110, 80) }) },
    { id: "cross", zh: "双手抱胸", en: "Arms crossed", say: ["站立,双手抱胸", "standing with arms crossed"], pose: P({ lArm: limb(12, 30, 105, 60), rArm: limb(12, 25, 100, 60) }) },
    { id: "wave", zh: "挥手", en: "Waving", say: ["站立挥手打招呼", "standing and waving hello with one hand"], pose: P({ rArm: limb(85, 10, 105, -80), headTilt: 6 }) },
    { id: "cheer", zh: "双手举高", en: "Arms up", say: ["双手高举过头", "both arms raised high above the head"], pose: P({ lArm: limb(160, 10, 15), rArm: limb(160, 10, 15), headPitch: -12 }) },
    { id: "point", zh: "指向前方", en: "Pointing", say: ["一只手伸直指向远方", "pointing into the distance with one arm outstretched"], pose: P({ rArm: limb(15, 85, 0), headYaw: -10 }) },
    { id: "phone", zh: "打电话", en: "On the phone", say: ["一手拿手机贴在耳边打电话", "talking on the phone, holding it to the ear"], pose: P({ rArm: limb(-20, 100, 125, 40), headTilt: -8 }) },
    { id: "lookphone", zh: "低头看手机", en: "Looking at phone", say: ["低头看着手里的手机", "looking down at a phone held in both hands"], pose: P({ lArm: limb(10, 5, 95, 30), rArm: limb(10, 5, 95, 30), headPitch: 32 }) },
    { id: "think", zh: "托腮思考", en: "Thinking", say: ["一手托腮思考", "thinking with a hand on the chin"], pose: P({ rArm: limb(-20, 45, 135, 60), lArm: limb(12, 30, 100, 60), headTilt: 8, headPitch: 8 }) },
    { id: "walk", zh: "走路", en: "Walking", say: ["向前走路", "walking forward mid-stride"], pose: P({ lLeg: limb(22, 2, 8), rLeg: limb(-18, 2, 22), lArm: limb(8, -22, 15), rArm: limb(8, 24, 20) }) },
    { id: "run", zh: "奔跑", en: "Running", say: ["奔跑中", "running mid-stride"], pose: P({ lean: 14, lLeg: limb(55, 2, 75), rLeg: limb(-28, 2, 70), lArm: limb(10, -40, 95), rArm: limb(10, 50, 95) }) },
    { id: "sit", zh: "坐着", en: "Sitting", say: ["坐在椅子上,双手放在腿上", "sitting on a chair with hands resting on the lap"], pose: P({ seated: true, lLeg: limb(88, 6, 88), rLeg: limb(88, 6, 88), lArm: limb(10, 42, 55), rArm: limb(10, 42, 55) }) },
    { id: "lookback", zh: "回眸", en: "Looking back", say: ["背对镜头,回头看向身后", "turned away and looking back over the shoulder"], pose: P({ yaw: 155, headYaw: 75, headTilt: 5 }) }
  ];

  // Body measurements (metres) for a ~1.75 m figure.
  const B = { pelvis: 0.95, spine: 0.45, neck: 0.1, head: 0.16, headR: 0.115, shoulder: 0.19, upper: 0.3, fore: 0.27, hand: 0.08, hip: 0.1, thigh: 0.45, shin: 0.45, foot: 0.15, seat: 0.48 };

  /** Joint positions for a pose (forward kinematics). */
  function skeleton(p) {
    const body = ry(p.yaw);
    const upperBody = chain(body, rx(p.lean), rz(p.side));
    const legDir = (L, s) => chain(body, rz(s * L.b), rx(-L.a)); // s = +1 left (+x), -1 right
    const pelvis0 = v(0, 0, 0);
    const J = {};
    J.pelvis = pelvis0;
    J.chest = add(pelvis0, mv(upperBody, v(0, B.spine, 0)));
    J.neck = add(J.chest, mv(upperBody, v(0, B.neck, 0)));
    const headM = chain(upperBody, ry(p.headYaw), rx(p.headPitch), rz(-p.headTilt));
    J.head = add(J.neck, mv(headM, v(0, B.head, 0)));
    J.headM = headM;
    for (const [side, s] of [["l", 1], ["r", -1]]) {
      const A = p[side + "Arm"];
      const sh = add(J.chest, mv(upperBody, v(s * B.shoulder, -0.02, 0)));
      // Raise out to the side about z, forward about x, twist inward (d) about the arm, then bend the elbow.
      const armM = chain(upperBody, rz(s * A.a), rx(-A.b), ry(-s * (A.d || 0)));
      const el = add(sh, mv(armM, v(0, -B.upper, 0)));
      const foreM = chain(armM, rx(-A.c));
      const wr = add(el, mv(foreM, v(0, -B.fore, 0)));
      const hd = add(wr, mv(foreM, v(0, -B.hand, 0)));
      J[side + "Shoulder"] = sh; J[side + "Elbow"] = el; J[side + "Wrist"] = wr; J[side + "Hand"] = hd;
      const Lg = p[side + "Leg"];
      const hp = add(pelvis0, mv(body, v(s * B.hip, -0.04, 0)));
      const legM = legDir(Lg, s);
      const kn = add(hp, mv(legM, v(0, -B.thigh, 0)));
      const shinM = chain(legM, rx(Lg.c));
      const an = add(kn, mv(shinM, v(0, -B.shin, 0)));
      const toe = add(an, mv(chain(body, rz(s * Lg.b), rx(-Math.min(Lg.a - Lg.c, 0) * 0.3)), v(0, -0.02, B.foot)));
      J[side + "Hip"] = hp; J[side + "Knee"] = kn; J[side + "Ankle"] = an; J[side + "Toe"] = toe;
    }
    // Stand on the ground, or sit on a stool.
    let lift;
    if (p.seated) lift = B.seat + 0.06;
    else lift = -Math.min(J.lAnkle[1], J.rAnkle[1], J.lToe[1], J.rToe[1]) + 0.07;
    for (const k in J) if (k !== "headM") J[k] = add(J[k], v(0, lift, 0));
    J.forward = mv(body, v(0, 0, 1));
    J.headForward = mv(headM, v(0, 0, 1));
    return J;
  }

  /* ---------- camera model ---------- */
  // az: 0 front, 90 the character's right, 180 back, 270 left. el: -30 (low) .. 60 (high). dist: 0.6 (close) .. 1.4 (wide).
  const camDir = c => norm(v(-Math.sin(c.az * D2R) * Math.cos(c.el * D2R), Math.sin(c.el * D2R), Math.cos(c.az * D2R) * Math.cos(c.el * D2R)));
  function shotCamera(c, J) {
    // Frame by shot size: close-up on the face, medium from the waist up, full body, then wide.
    const foot = Math.min(J.lAnkle[1], J.rAnkle[1]), head = J.head[1];
    const stops = [
      [0.6, head - 0.02, 0.85], [0.8, head - 0.2, 1.5], [1.0, (head + J.pelvis[1]) / 2, 2.55],
      [1.2, (head + foot) / 2 + 0.05, 3.9], [1.4, (head + foot) / 2, 7.5]
    ];
    let k = 0;
    while (k < stops.length - 2 && c.dist > stops[k + 1][0]) k++;
    const [d0, y0, r0] = stops[k], [d1, y1, r1] = stops[k + 1];
    const t = clamp((c.dist - d0) / (d1 - d0), 0, 1);
    const target = v(J.head[0] * (1 - t * 0.5), y0 + (y1 - y0) * t, J.head[2] * (1 - t * 0.5));
    return { pos: add(target, mul(camDir(c), r0 + (r1 - r0) * t)), target, fov: 32 };
  }

  /* ---------- projection ---------- */
  function makeView(eye, target, fovDeg, w, h) {
    const f = norm(sub(target, eye));
    const r = norm(cross(f, v(0, 1, 0)));
    const u = cross(r, f);
    const k = (h / 2) / Math.tan(fovDeg * D2R / 2);
    return {
      eye, f, r, u, w, h,
      project(p) {
        const d = sub(p, eye);
        const z = dot(d, f);
        if (z < 0.05) return null;
        return { x: w / 2 + dot(d, r) * k / z, y: h / 2 - dot(d, u) * k / z, z, s: k / z };
      }
    };
  }

  /* ---------- describing the shot and pose in words ---------- */
  const AZ = [
    ["正面视角", "front view"], ["右前方四分之三侧面", "front-right three-quarter view"], ["右侧面", "right side view, in profile"],
    ["右后方四分之三背面", "back-right three-quarter view"], ["背面视角", "back view"], ["左后方四分之三背面", "back-left three-quarter view"],
    ["左侧面", "left side view, in profile"], ["左前方四分之三侧面", "front-left three-quarter view"]
  ];
  function elWords(el) {
    if (el < -20) return ["低角度仰拍", "low angle shot, looking up at the subject"];
    if (el < -7) return ["略微仰拍", "slightly low angle"];
    if (el <= 7) return ["平视", "eye level"];
    if (el <= 25) return ["略微俯拍", "slightly high angle"];
    if (el <= 50) return ["高角度俯拍", "high angle shot, looking down at the subject"];
    return ["鸟瞰俯视", "bird's-eye view from above"];
  }
  function distWords(d) {
    if (d < 0.7) return ["特写", "close-up"];
    if (d < 0.85) return ["近景", "medium close-up"];
    if (d < 1.05) return ["中景", "medium shot"];
    if (d < 1.25) return ["全身景", "full shot, whole body in frame"];
    return ["远景", "wide shot"];
  }
  function describeCamera(c, lang) {
    const i = lang === "zh" ? 0 : 1;
    const az = AZ[Math.round((((c.az % 360) + 360) % 360) / 45) % 8][i];
    return [az, elWords(c.el)[i], distWords(c.dist)[i]].join(lang === "zh" ? "," : ", ");
  }

  // [zh one arm, en one arm, zh both arms, en both arms]
  function armWords(A) {
    if (A.a > 135 || A.b > 140) return ["手臂高举过头", "arm raised overhead", "双手高举过头", "both arms raised overhead"];
    if (A.b > 60 && A.c < 50) return ["手臂向前伸直", "arm reaching forward", "双臂向前伸直", "both arms reaching forward"];
    if (A.a > 60 && A.c < 60) return ["手臂向侧面张开", "arm stretched out to the side", "双臂向两侧张开", "arms stretched out to the sides"];
    if (A.a > 70) return ["手举起来", "hand raised up", "双手举起", "both hands raised"];
    if (A.c > 85 && A.a >= 20 && A.a <= 65 && A.b < 20) return ["手叉在腰上", "hand on the hip", "双手叉腰", "hands on hips"];
    if (A.c > 120 && A.b >= 10) return ["手抬到脸旁", "hand raised to the face", "双手抬到脸旁", "both hands raised to the face"];
    if (A.c > 60 && A.b > 15) return ["手臂弯曲在胸前", "arm bent in front of the chest", "双臂弯曲在胸前", "both arms bent in front of the chest"];
    if (A.b < -20) return ["手臂向后摆", "arm swinging back", "双臂向后摆", "both arms swinging back"];

  }

  function describePose(p, cam, lang) {
    const zh = lang === "zh";
    const i = zh ? 0 : 1;
    const parts = [];
    const preset = p.preset && PRESETS.find(x => x.id === p.preset);
    if (preset) parts.push(preset.say[i]);
    else {
      const bentKnees = p.lLeg.c > 55 && p.rLeg.c > 55;
      if (p.seated) parts.push(zh ? "坐着" : "sitting");
      else if (bentKnees && p.lLeg.a > 50 && p.rLeg.a > 50) parts.push(zh ? "蹲着" : "crouching");
      else if (Math.abs(p.lLeg.a - p.rLeg.a) > 30) parts.push(zh ? "迈步向前" : "mid-stride");
      else parts.push(zh ? "站立" : "standing");
      if (p.lean > 15) parts.push(zh ? "身体前倾" : "leaning forward");
      else if (p.lean < -12) parts.push(zh ? "身体后仰" : "leaning back");
      if (Math.abs(p.side) > 12) parts.push(zh ? "身体向一侧倾斜" : "body tilted to one side");
      const l = armWords(p.lArm), r = armWords(p.rArm);
      if (l && r && l[1] === r[1]) parts.push(l[i + 2]);
      else {
        if (l) parts.push((zh ? "左" : "left ") + l[i]);
        if (r) parts.push((zh ? "右" : "right ") + r[i]);
      }
      if (p.lLeg.c > 55 && !p.seated && p.lLeg.a > 40 && p.rLeg.a < 25) parts.push(zh ? "抬起左膝" : "left knee raised");
      if (p.rLeg.c > 55 && !p.seated && p.rLeg.a > 40 && p.lLeg.a < 25) parts.push(zh ? "抬起右膝" : "right knee raised");
      if (p.headYaw > 25) parts.push(zh ? "头转向自己的左边" : "head turned to their left");
      else if (p.headYaw < -25) parts.push(zh ? "头转向自己的右边" : "head turned to their right");
      if (p.headPitch > 15) parts.push(zh ? "低头" : "looking down");
      else if (p.headPitch < -15) parts.push(zh ? "抬头向上看" : "looking up");
      if (Math.abs(p.headTilt) > 12) parts.push(zh ? "微微歪头" : "head tilted");

    if (cam) {

      const a = Math.abs(rel);

        : a < 70 ? ["身体微微侧向一边", "body turned slightly to the side"]
        : a < 110 ? ["身体侧对镜头", "body in profile to the camera"]
        : a < 155 ? ["身体大半背对镜头", "body turned mostly away from the camera"]
        : ["背对镜头", "back to the camera"];
      if (!(preset && preset.id === "lookback" && a >= 110)) parts.push(facing[i]);
    }
    return parts.join(zh ? "," : ", ");
  }

  /* ---------- text ---------- */
  const T = {

      seated: "坐着(加一张凳子)", presets: "常用姿势", camPresets: "常用角度", output: "提示词" },

  const CAM_PRESETS = [
    { zh: "正面平视", en: "Front, eye level", c: { az: 0, el: 0, dist: 1 } },
    { zh: "四分之三侧面", en: "Three-quarter", c: { az: 45, el: 10, dist: 1 } },
    { zh: "侧面", en: "Profile", c: { az: 90, el: 0, dist: 1 } },

    { zh: "俯拍", en: "High angle", c: { az: 30, el: 40, dist: 1 } },
    { zh: "脸部特写", en: "Face close-up", c: { az: 15, el: 5, dist: 0.62 } },
    { zh: "大远景", en: "Wide establishing", c: { az: 30, el: 20, dist: 1.4 } }

  const PART_SLIDERS = {
    body: [["yaw", -180, 180], ["lean", -30, 60], ["side", -30, 30]],
    head: [["headYaw", -80, 80], ["headPitch", -40, 45], ["headTilt", -30, 30]],
    lArm: [["a", -45, 180], ["b", -60, 180], ["c", 0, 150], ["d", -90, 120]], rArm: [["a", -45, 180], ["b", -60, 180], ["c", 0, 150], ["d", -90, 120]],
    lLeg: [["legA", -40, 110], ["legB", -10, 60], ["legC", 0, 140]], rLeg: [["legA", -40, 110], ["legB", -10, 60], ["legC", 0, 140]]
  };

  /* ---------- the widget ---------- */
  function create(root, opts = {}) {
    let lang = opts.lang || "en";
    let ratio = opts.ratio || "16:9";
    let state = { tab: "camera", cam: { az: 45, el: 10, dist: 1 }, pose: Object.assign(BASE(), { preset: "stand" }), part: "rArm" };
    if (opts.value) load(opts.value);
    let view = { yaw: 35, pitch: 20, dist: 5.6 };

    root.classList.add("cps");
    root.innerHTML = `
      <div class="cps-top">
        <div class="cps-tabs" role="tablist"><button type="button" data-tab="camera"></button><button type="button" data-tab="pose"></button></div>
        <button type="button" class="cps-reset" data-reset></button>
      </div>
      <div class="cps-stage">
        <canvas class="cps-main" aria-label="3D"></canvas>
        <div class="cps-inset"><canvas></canvas><span class="cps-inset-label"></span></div>
        <div class="cps-help"></div>
      </div>
      <div class="cps-out"><b></b><span class="cps-out-text"></span></div>
      <div class="cps-panel"></div>`;
    const main = root.querySelector(".cps-main");
    const inset = root.querySelector(".cps-inset canvas");
    const panel = root.querySelector(".cps-panel");
    const ctx = main.getContext("2d"), ictx = inset.getContext("2d");

    function load(val) {
      if (val.cam) state.cam = Object.assign({ az: 45, el: 10, dist: 1 }, val.cam);
      if (val.pose) {
        const b = BASE();
        state.pose = Object.assign(b, val.pose);
        for (const k of ["lArm", "rArm", "lLeg", "rLeg"]) state.pose[k] = Object.assign(limb(), b[k], val.pose[k] || {});
      }
    }
    const value = () => ({ cam: { ...state.cam }, pose: JSON.parse(JSON.stringify(state.pose)) });
    // kind: "cam" or "pose", whichever the user just touched.
    const emit = kind => { opts.onChange && opts.onChange(value(), kind); };

    /* --- drawing --- */
    let W = 0, H = 0, dpr = 1, mainView, handles = [];
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = main.getBoundingClientRect();
      W = r.width; H = r.height;
      main.width = W * dpr; main.height = H * dpr;
      const [rw, rh] = ratio.split(":").map(Number);
      const iw = rw >= rh ? 148 : 92, ih = iw * rh / rw;
      inset.style.width = iw + "px"; inset.style.height = ih + "px";
      inset.width = iw * dpr; inset.height = ih * dpr;
    }

    const FIG = { body: "#b9a8ff", limb: "#a996ff", joint: "#ff7eb6", head: "#cbbcff" };
    function figurePrims(J) {
      const prims = [];
      const cap = (a, b, r, col, part) => prims.push({ k: "cap", a, b, r, col, part });
      const ball = (a, r, col, part) => prims.push({ k: "ball", a, r, col, part });
      cap(J.pelvis, J.chest, 0.115, FIG.body, "body");
      cap(J.lShoulder, J.rShoulder, 0.065, FIG.body, "body");
      cap(J.lHip, J.rHip, 0.085, FIG.body, "body");
      cap(J.chest, J.neck, 0.05, FIG.body, "body");
      for (const s of ["l", "r"]) {
        cap(J[s + "Shoulder"], J[s + "Elbow"], 0.045, FIG.limb, s + "Arm");
        cap(J[s + "Elbow"], J[s + "Wrist"], 0.04, FIG.limb, s + "Arm");
        cap(J[s + "Wrist"], J[s + "Hand"], 0.035, FIG.limb, s + "Arm");
        cap(J[s + "Hip"], J[s + "Knee"], 0.065, FIG.limb, s + "Leg");
        cap(J[s + "Knee"], J[s + "Ankle"], 0.052, FIG.limb, s + "Leg");
        cap(J[s + "Ankle"], J[s + "Toe"], 0.04, FIG.limb, s + "Leg");
      }
      ball(J.head, B.headR, FIG.head, "head");
      if (state.pose.seated) {
        const y = B.seat, c = [0, 0, -0.05];
        prims.push({ k: "box", a: add(c, v(-0.22, 0, -0.2)), b: add(c, v(0.22, y, 0.2)) });
      }
      return prims;
    }

    function drawScene(g, vw, opts2) {
      const { w, h } = vw;
      // floor grid
      g.lineWidth = 1;
      for (let i = -6; i <= 6; i++) {
        for (const [a, b] of [[v(i * 0.5, 0, -3), v(i * 0.5, 0, 3)], [v(-3, 0, i * 0.5), v(3, 0, i * 0.5)]]) {
          const pa = vw.project(a), pb = vw.project(b);
          if (!pa || !pb) continue;
          g.strokeStyle = i === 0 ? "rgba(185,168,255,.22)" : "rgba(255,255,255,.06)";
          g.beginPath(); g.moveTo(pa.x, pa.y); g.lineTo(pb.x, pb.y); g.stroke();
        }
      }
      const J = skeleton(state.pose);
      // soft shadow
      const sh = vw.project(v(0, 0, 0));
      if (sh) { g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(sh.x, sh.y, 0.32 * sh.s, 0.1 * sh.s, 0, 0, Math.PI * 2); g.fill(); }
      const prims = figurePrims(J);
      const items = [];
      for (const pr of prims) {
        if (pr.k === "box") { items.push({ z: (vw.project(mul(add(pr.a, pr.b), 0.5)) || { z: 0 }).z, draw: () => drawBox(g, vw, pr) }); continue; }
        const pa = vw.project(pr.a), pb = pr.k === "cap" ? vw.project(pr.b) : pa;
        if (!pa || !pb) continue;
        const z = (pa.z + pb.z) / 2;
        items.push({ z, draw: () => {
          const shade = clamp(1.2 - z / (opts2.depth || 14), 0.7, 1);
          if (pr.k === "cap") {

            g.lineCap = "round";
            g.strokeStyle = "rgba(20,14,40,.55)"; g.lineWidth = w2 + 2.5;
            g.beginPath(); g.moveTo(pa.x, pa.y); g.lineTo(pb.x, pb.y); g.stroke();
            g.strokeStyle = tint(pr.col, shade); g.lineWidth = w2;
            g.beginPath(); g.moveTo(pa.x, pa.y); g.lineTo(pb.x, pb.y); g.stroke();
            g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = Math.max(1, w2 * 0.28);
            g.beginPath(); g.moveTo(pa.x - w2 * 0.12, pa.y - w2 * 0.12); g.lineTo(pb.x - w2 * 0.12, pb.y - w2 * 0.12); g.stroke();
          } else {
            const r = pr.r * pa.s;
            const grd = g.createRadialGradient(pa.x - r * 0.35, pa.y - r * 0.4, r * 0.1, pa.x, pa.y, r);
            grd.addColorStop(0, tint("#ffffff", shade)); grd.addColorStop(1, tint(pr.col, shade * 0.9));
            g.fillStyle = grd; g.strokeStyle = "rgba(20,14,40,.55)"; g.lineWidth = 1.5;
            g.beginPath(); g.arc(pa.x, pa.y, r, 0, Math.PI * 2); g.fill(); g.stroke();
            // Face: eyes show which way the head points.
            const fwd = J.headForward;
            const toEye = norm(sub(vw.eye, J.head));
            if (dot(fwd, toEye) > -0.15) {
              const right = mv(J.headM, v(1, 0, 0)), up = mv(J.headM, v(0, 1, 0));
              for (const s of [-1, 1]) {
                const e = add(add(J.head, mul(fwd, B.headR * 0.92)), add(mul(right, s * 0.042), mul(up, 0.015)));
                const pe = vw.project(e);
                if (pe) { g.fillStyle = "#2a1f4d"; g.beginPath(); g.arc(pe.x, pe.y, Math.max(1.2, 0.016 * pe.s), 0, Math.PI * 2); g.fill(); }
              }
              const n = vw.project(add(J.head, mul(fwd, B.headR * 1.02)));
              if (n) { g.fillStyle = "rgba(255,126,182,.7)"; g.beginPath(); g.arc(n.x, n.y + 0.03 * n.s, Math.max(1, 0.012 * n.s), 0, Math.PI * 2); g.fill(); }
            }
          }
        } });
      }
      items.sort((a, b) => b.z - a.z).forEach(it => it.draw());
      return J;
    }

    function drawBox(g, vw, pr) {
      const [x0, y0, z0] = pr.a, [x1, y1, z1] = pr.b;
      const faces = [
        [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]],
        [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]],
        [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]],
        [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]],
        [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]]
      ].map(f => f.map(p => vw.project(p)));
      faces.forEach((f, i) => {
        if (f.some(p => !p)) return;
        g.fillStyle = i === 0 ? "rgba(120,110,150,.5)" : "rgba(80,72,110,.45)";
        g.strokeStyle = "rgba(185,168,255,.25)";
        g.beginPath(); f.forEach((p, k) => k ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); g.fill(); g.stroke();
      });
    }

    function tint(hex, k) {
      const n = parseInt(hex.slice(1), 16);
      const r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
      return `rgb(${Math.round(r * k)},${Math.round(gg * k)},${Math.round(b * k)})`;
    }

    const CENTER = v(0, 0.95, 0), RING = 1.55;
    function ringPoint(az, el, r = RING) {
      const d = camDir({ az, el });
      return add(CENTER, mul(d, r));
    }
    function camPoint() { return ringPoint(state.cam.az, state.cam.el, RING * (0.55 + state.cam.dist * 0.6)); }

    function render() {
      if (!W) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const eye = add(v(0, 0.78, 0), mul(norm(v(-Math.sin(view.yaw * D2R) * Math.cos(view.pitch * D2R), Math.sin(view.pitch * D2R), Math.cos(view.yaw * D2R) * Math.cos(view.pitch * D2R))), view.dist));
      mainView = makeView(eye, v(0, 0.78, 0), 38, W, H);
      handles = [];
      const vw = mainView;
      const J = drawScene(ctx, vw, { depth: 14 });

      if (state.tab === "camera") {
        // azimuth ring on the floor plane at subject height
        ctx.lineWidth = 5; ctx.strokeStyle = "rgba(41,231,170,.9)"; ctx.shadowColor = "rgba(41,231,170,.6)"; ctx.shadowBlur = 10;
        poly(ctx, Array.from({ length: 73 }, (_, i) => vw.project(add(v(CENTER[0], 0.02, CENTER[2]), mul(v(-Math.sin(i * 5 * D2R), 0, Math.cos(i * 5 * D2R)), RING)))));
        // elevation arc in the current azimuth plane
        ctx.strokeStyle = "rgba(255,110,180,.9)"; ctx.shadowColor = "rgba(255,110,180,.6)";
        poly(ctx, Array.from({ length: 31 }, (_, i) => vw.project(ringPoint(state.cam.az, -30 + i * 3))));
        ctx.shadowBlur = 0;
        // line from subject to camera
        const cp = vw.project(camPoint()), cc = vw.project(CENTER);
        if (cp && cc) { ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,170,90,.7)"; ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.lineTo(cp.x, cp.y); ctx.stroke(); ctx.setLineDash([]); }
        const azP = vw.project(add(v(CENTER[0], 0.02, CENTER[2]), mul(v(-Math.sin(state.cam.az * D2R), 0, Math.cos(state.cam.az * D2R)), RING)));
        const elP = vw.project(ringPoint(state.cam.az, state.cam.el));
        handle(azP, "#29e7aa", "az"); handle(elP, "#ff6eb4", "el");
        if (cp) { drawCamIcon(ctx, cp); handle(cp, "#ff9a3c", "dist", 9); }
      } else {
        // joint handles for picking body parts
        const pts = { body: J.chest, head: J.head, lArm: J.lHand, rArm: J.rHand, lLeg: J.lAnkle, rLeg: J.rAnkle };
        for (const [part, p] of Object.entries(pts)) {
          const pp = vw.project(p);
          handle(pp, part === state.part ? "#ffffff" : "#ff7eb6", "part:" + part, part === state.part ? 8 : 6, part === state.part);
        }
      }
      renderInset();
    }

    function poly(g, pts) {
      g.beginPath();
      let started = false;
      for (const p of pts) { if (!p) { started = false; continue; } if (started) g.lineTo(p.x, p.y); else { g.moveTo(p.x, p.y); started = true; } }
      g.stroke();
    }
    function handle(p, col, id, r = 8, ring) {
      if (!p) return;
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = ring ? "#ff7eb6" : "rgba(255,255,255,.85)"; ctx.lineWidth = ring ? 3 : 1.5; ctx.stroke();
      handles.push({ id, x: p.x, y: p.y, r: r + 8 });
    }
    function drawCamIcon(g, p) {
      g.save(); g.translate(p.x, p.y);
      g.fillStyle = "rgba(255,154,60,.18)"; g.strokeStyle = "rgba(255,154,60,.9)"; g.lineWidth = 1.5;
      g.beginPath(); g.roundRect(-16, -11, 22, 18, 4); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(6, -4); g.lineTo(16, -9); g.lineTo(16, 5); g.lineTo(6, 0); g.closePath(); g.fill(); g.stroke();
      g.restore();
    }

    function renderInset() {
      const w = inset.width / dpr, h = inset.height / dpr;
      ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const grd = ictx.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, "#1d1a2e"); grd.addColorStop(1, "#0d0c14");
      ictx.fillStyle = grd; ictx.fillRect(0, 0, w, h);
      const J = skeleton(state.pose);
      const sc = shotCamera(state.cam, J);
      // Keep the vertical field of view for tall frames by scaling with the frame height.
      const vw = makeView(sc.pos, sc.target, sc.fov * (h > w ? 1.25 : 1), w, h);
      drawScene(ictx, vw, { depth: 20 });
    }

    /* --- interaction --- */
    let drag = null;
    const pt = e => { const r = main.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    main.addEventListener("pointerdown", e => {
      const p = pt(e);
      const h = handles.slice().reverse().find(h => Math.hypot(h.x - p.x, h.y - p.y) <= h.r);
      if (h && h.id.startsWith("part:")) { state.part = h.id.slice(5); renderPanel(); drag = { kind: "part", last: p }; }
      else if (h) drag = { kind: h.id };
      else drag = { kind: "orbit", last: p };
      main.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    main.addEventListener("pointermove", e => {
      const p = pt(e);
      if (!drag) {
        const h = handles.find(h => Math.hypot(h.x - p.x, h.y - p.y) <= h.r);
        main.style.cursor = h ? "grab" : "default";
        return;
      }
      const vw = mainView;
      if (drag.kind === "orbit") {
        view.yaw -= (p.x - drag.last.x) * 0.4;
        view.pitch = clamp(view.pitch + (p.y - drag.last.y) * 0.3, -5, 80);
        drag.last = p;
      } else if (drag.kind === "az") {
        let best = 0, bd = 1e9;
        for (let a = 0; a < 360; a += 1) {
          const q = vw.project(add(v(CENTER[0], 0.02, CENTER[2]), mul(v(-Math.sin(a * D2R), 0, Math.cos(a * D2R)), RING)));
          if (q) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = a; } }
        }
        state.cam.az = Math.round(best / 5) * 5 % 360;
        changed();
      } else if (drag.kind === "el") {
        let best = 0, bd = 1e9;
        for (let a = -30; a <= 60; a += 1) {
          const q = vw.project(ringPoint(state.cam.az, a));
          if (q) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = a; } }
        }
        state.cam.el = Math.round(best / 5) * 5;
        changed();
      } else if (drag.kind === "dist") {
        let best = 1, bd = 1e9;
        for (let d = 0.6; d <= 1.401; d += 0.02) {
          const q = vw.project(ringPoint(state.cam.az, state.cam.el, RING * (0.55 + d * 0.6)));
          if (q) { const dd = Math.hypot(q.x - p.x, q.y - p.y); if (dd < bd) { bd = dd; best = d; } }
        }
        state.cam.dist = Math.round(best * 20) / 20;
        changed();
      } else if (drag.kind === "part") {
        const dx = p.x - drag.last.x, dy = p.y - drag.last.y;
        drag.last = p;
        nudge(state.part, dx, dy);
        changed(true);
      }
      render();
    });
    const end = () => { drag = null; };
    main.addEventListener("pointerup", end);
    main.addEventListener("pointercancel", end);
    main.addEventListener("wheel", e => { e.preventDefault(); view.dist = clamp(view.dist * (1 + Math.sign(e.deltaY) * 0.08), 3.2, 11); render(); }, { passive: false });

    // Dragging a body part: horizontal and vertical movement map to its two main angles.
    function nudge(part, dx, dy) {
      const p = state.pose;
      // Mirror horizontal drags when we look at the figure from behind.
      const facing = Math.cos((view.yaw - p.yaw) * D2R) >= 0 ? 1 : -1;
      const k = 0.6;
      if (part === "body") { p.yaw = wrap(p.yaw + dx * k); p.lean = clamp(p.lean + dy * k * 0.5, -30, 60); }
      else if (part === "head") { p.headYaw = clamp(p.headYaw + dx * k * facing, -80, 80); p.headPitch = clamp(p.headPitch + dy * k, -40, 45); }
      else if (part === "lArm" || part === "rArm") {
        const A = p[part], s = part === "lArm" ? 1 : -1;
        A.a = clamp(A.a + dx * k * s * facing, -45, 180); A.b = clamp(A.b - dy * k, -60, 180);
      } else {
        const L = p[part], s = part === "lLeg" ? 1 : -1;
        L.b = clamp(L.b + dx * k * 0.5 * s * facing, -10, 60); L.a = clamp(L.a - dy * k, -40, 110);
      }
    }
    const wrap = a => ((((a + 180) % 360) + 360) % 360) - 180;

    function changed(poseEdit) {
      if (poseEdit) state.pose.preset = null;
      updateOut();
      syncSliders();
      emit(poseEdit ? "pose" : "cam");
    }

    /* --- panel --- */
    function sliderRow(key, label, min, max, val, hint, step = 1, unit = "°") {
      return `<label class="cps-sl"><span class="cps-sl-top"><span>${label}</span><output>${fmt(val, unit)}</output></span>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-sl="${key}">${hint ? `<small>${hint}</small>` : ""}</label>`;
    }
    const fmt = (x, unit) => unit === "°" ? `${Math.round(x)}°` : (+x).toFixed(2);

    function renderPanel() {
      const tx = T[lang];
      root.querySelectorAll("[data-tab]").forEach(b => { b.textContent = tx[b.dataset.tab]; b.setAttribute("aria-selected", b.dataset.tab === state.tab); });
      root.querySelector("[data-reset]").textContent = tx.reset;
      root.querySelector(".cps-inset-label").textContent = tx.view;
      root.querySelector(".cps-help").textContent = state.tab === "camera" ? tx.dragCam : tx.dragPose;
      root.querySelector(".cps-out b").textContent = tx.output;
      let html = "";
      if (state.tab === "camera") {
        html += `<div class="cps-chips"><span>${tx.camPresets}</span>${CAM_PRESETS.map((c, i) => `<button type="button" data-campreset="${i}">${c[lang]}</button>`).join("")}</div>`;
        html += sliderRow("cam.az", tx.az, 0, 355, state.cam.az, tx.azHint, 5);
        html += sliderRow("cam.el", tx.el, -30, 60, state.cam.el, tx.elHint, 5);
        html += sliderRow("cam.dist", tx.dist, 0.6, 1.4, state.cam.dist, tx.distHint, 0.05, "");
      } else {
        html += `<div class="cps-chips"><span>${tx.presets}</span>${PRESETS.map(p => `<button type="button" data-preset="${p.id}" aria-pressed="${state.pose.preset === p.id}">${p[lang]}</button>`).join("")}</div>`;
        html += `<div class="cps-parts">${Object.keys(PART_SLIDERS).map(k => `<button type="button" data-part="${k}" aria-pressed="${k === state.part}">${tx.parts[k]}</button>`).join("")}</div>`;
        const target = state.part === "body" || state.part === "head" ? state.pose : state.pose[state.part];
        html += PART_SLIDERS[state.part].map(([k, mn, mx]) => {
          const key = k.replace(/^leg/, "").toLowerCase();
          const prop = ["a", "b", "c", "d"].includes(key) ? key : k;
          return sliderRow("pose." + prop, tx.sliders[k], mn, mx, target[prop], "", 1);
        }).join("");
        html += `<label class="cps-check"><input type="checkbox" data-seated ${state.pose.seated ? "checked" : ""}> ${tx.seated}</label>`;
      }
      panel.innerHTML = html;
      updateOut();
    }
    function syncSliders() {
      panel.querySelectorAll("[data-sl]").forEach(inp => {
        const [grp, prop] = inp.dataset.sl.split(".");
        const target = grp === "cam" ? state.cam : (state.part === "body" || state.part === "head" ? state.pose : state.pose[state.part]);
        inp.value = target[prop];
        inp.closest(".cps-sl").querySelector("output").textContent = fmt(target[prop], grp === "cam" && prop === "dist" ? "" : "°");
      });
      panel.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", state.pose.preset === b.dataset.preset));
    }
    function updateOut() {
      root.querySelector(".cps-out-text").textContent = state.tab === "camera" ? describeCamera(state.cam, opts.plang ? opts.plang() : lang) : describePose(state.pose, state.cam, opts.plang ? opts.plang() : lang);
    }

    root.addEventListener("click", e => {
      const tab = e.target.closest("[data-tab]");
      if (tab) { state.tab = tab.dataset.tab; renderPanel(); render(); return; }
      if (e.target.closest("[data-reset]")) {
        if (state.tab === "camera") state.cam = { az: 45, el: 10, dist: 1 };
        else state.pose = Object.assign(BASE(), { preset: "stand" });
        renderPanel(); render(); emit(state.tab === "camera" ? "cam" : "pose"); return;
      }
      const cp = e.target.closest("[data-campreset]");
      if (cp) { state.cam = { ...CAM_PRESETS[+cp.dataset.campreset].c }; syncSliders(); updateOut(); render(); emit("cam"); return; }
      const pr = e.target.closest("[data-preset]");
      if (pr) {
        const preset = PRESETS.find(x => x.id === pr.dataset.preset);
        state.pose = Object.assign(JSON.parse(JSON.stringify(preset.pose)), { preset: preset.id });
        renderPanel(); render(); emit("pose"); return;
      }
      const part = e.target.closest("[data-part]");
      if (part) { state.part = part.dataset.part; renderPanel(); render(); }
    });
    root.addEventListener("input", e => {
      const sl = e.target.closest("[data-sl]");
      if (sl) {
        const [grp, prop] = sl.dataset.sl.split(".");
        const target = grp === "cam" ? state.cam : (state.part === "body" || state.part === "head" ? state.pose : state.pose[state.part]);
        target[prop] = +sl.value;
        changed(grp === "pose");
        render();
      }
      if (e.target.closest("[data-seated]")) { state.pose.seated = e.target.checked; changed(true); render(); }
    });

    const ro = new ResizeObserver(() => { size(); render(); });
    ro.observe(main);
    size(); renderPanel(); render();

    return {
      value,
      set(val) { load(val || {}); renderPanel(); render(); },
      setLang(l) { lang = l; renderPanel(); },
      setRatio(r) { ratio = r; size(); render(); },
      refresh() { size(); render(); updateOut(); },
      describe: (l) => ({ camera: describeCamera(state.cam, l), pose: describePose(state.pose, state.cam, l) })
    };
  }

  return { create, describeCamera, describePose, PRESETS };
})();

  lang, ratio: "1:1", plang: () => plang,
  value: { cam: cp.cam || undefined, pose: cp.pose || undefined },
  onChange(v, kind) {
    // Touching the camera or the pose turns that part on in the prompt.
    if (kind === "cam") cp.useCam = true;
    if (kind === "pose") cp.usePose = true;
    cp.cam = v.cam; cp.pose = v.pose;
    syncUse(); render();
  }
});
if (!cp.cam) { const v0 = studio.value(); cp.cam = v0.cam; cp.pose = v0.pose; }
function syncUse() {
  document.getElementById("useCam").checked = cp.useCam;
  document.getElementById("usePose").checked = cp.usePose;
}
document.getElementById("useCam").addEventListener("change", e => { cp.useCam = e.target.checked; render(); });
document.getElementById("usePose").addEventListener("change", e => { cp.usePose = e.target.checked; render(); });
syncUse();
// 打开 3D 镜头时,它取代「景别」和「拍摄角度」里选的词,免得提示词自相矛盾
const CAMERA_WORDS = new Set(DATA.style.groups[0].dims.filter(d => d.label[0] === "景别" || d.label[0] === "拍摄角度").flatMap(d => d.chips.map(c => c[0])));
const overridden = (cat, w) => cp.useCam && cat === "style" && CAMERA_WORDS.has(w);
const picked = cat => state[cat].filter(w => !overridden(cat, w));
// 镜头词放进「风格」,姿势放进「主体」
function extras(inLang) {
  const d = studio.describe(inLang);
  return { time:[], scene:[], subject: cp.usePose ? [d.pose] : [], style: cp.useCam ? [d.camera] : [] };
}

function wordText(id, inLang) {
  if (id.startsWith("c:")) return id.slice(2);
  return inLang === "zh" ? id : (EN[id] || id);
}

/* ================= 渲染面板 ================= */
function renderPanes() {
  CATS.forEach(cat => {
    const pane = document.querySelector(`.pane[data-pane="${cat}"]`);
    const d = DATA[cat];
    let html = `<div class="pane-tip">${d.tip[lang]}</div>`;
    d.groups.forEach(g => {
      if (g.title) html += `<div class="subgroup-title">${L(g.title)}</div>`;
      g.dims.forEach(dim => {
        html += `<div class="dim"><div class="dim-label">${L(dim.label)}</div><div class="chips">`;
        dim.chips.forEach(([zh, en]) => {
          html += `<button type="button" class="chip" data-cat="${cat}" data-word="${escapeHtml(zh)}" aria-pressed="false">${escapeHtml(lang === "zh" ? zh : en)}</button>`;
        });
        html += `</div></div>`;
      });
    });
    const ph = t("customPh").replace("{cat}", t("cat")[cat].toLowerCase());
    html += `<div class="custom-row">
      <input type="text" maxlength="40" placeholder="${escapeHtml(ph)}" data-input="${cat}" aria-label="${escapeHtml(ph)}">
      <button type="button" class="btn" data-add="${cat}">${t("add")}</button>
    </div>`;
    pane.innerHTML = html;
  });
}

function renderPresets() {
  document.getElementById("presetRow").innerHTML =
    PRESETS.map((p, i) => `<button type="button" class="preset" data-preset="${i}">${L(p.name)} <span>${L(p.tag)}</span></button>`).join("") +
    `<button type="button" class="btn dice" id="randomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/></svg>${t("random")}</button>`;
  if (activePreset !== null) showPresetNote(activePreset);
}

/* ================= 交互 ================= */
let activePreset = null;

function toggleWord(cat, word) {
  const arr = state[cat];
  const i = arr.indexOf(word);
  if (i >= 0) arr.splice(i, 1);
  else arr.push(word);
  render();
}

document.getElementById("builder").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { toggleWord(chip.dataset.cat, chip.dataset.word); return; }
  const add = e.target.closest("[data-add]");
  if (add) addCustom(add.dataset.add);
});
document.getElementById("builder").addEventListener("keydown", e => {
  const inp = e.target.closest("[data-input]");
  if (inp && e.key === "Enter") addCustom(inp.dataset.input);
});

function addCustom(cat) {
  const inp = document.querySelector(`[data-input="${cat}"]`);
  const w = inp.value.trim();
  if (!w) return;
  const id = "c:" + w;
  if (!state[cat].includes(id)) state[cat].push(id);
  inp.value = "";
  render();
}

/* tabs */
const tabs = document.querySelectorAll(".tab");
function switchTab(cat) {
  tabs.forEach(tb => {
    const on = tb.dataset.cat === cat;
    tb.classList.toggle("active", on);
    tb.setAttribute("aria-selected", on);
  });
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.dataset.pane === cat));
}
tabs.forEach(tb => tb.addEventListener("click", () => switchTab(tb.dataset.cat)));

/* 公式块 & 卡片跳转 */
document.querySelectorAll("[data-jump]").forEach(el => {
  el.addEventListener("click", () => {
    switchTab(el.dataset.jump);
    document.getElementById("builderHead").scrollIntoView({behavior:"smooth", block:"start"});
  });
});

/* presets */
function showPresetNote(i) {
  document.querySelectorAll(".preset").forEach(b => b.classList.toggle("active", +b.dataset.preset === i));
  const note = document.getElementById("presetNote");
  note.innerHTML = PRESETS[i].note[lang];
  note.hidden = false;
}
document.getElementById("presetRow").addEventListener("click", e => {
  const btn = e.target.closest(".preset");
  if (btn) {
    activePreset = +btn.dataset.preset;
    const p = PRESETS[activePreset];
    CATS.forEach(c => state[c] = [...p[c]]);
    render();
    showPresetNote(activePreset);
    switchTab("subject");
    return;
  }
  if (e.target.closest("#randomBtn")) randomIdea();
});

function clearPresetNote() {
  activePreset = null;
  document.querySelectorAll(".preset").forEach(b => b.classList.remove("active"));
  document.getElementById("presetNote").hidden = true;
}

/* 随机灵感:每个类别抽 1-2 个词 */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomIdea() {
  clearPresetNote();
  CATS.forEach(c => state[c] = []);
  // time: 抽一个时刻
  state.time.push(pick(DATA.time.groups[0].dims[2].chips)[0]);
  // subject: 随机选一个子类,抽前两维各一个词
  const g = pick(DATA.subject.groups);
  state.subject.push(pick(g.dims[0].chips)[0]);
  state.subject.push(pick(g.dims[1].chips)[0]);
  // scene: 自然或建筑抽一个 + 天气一个
  const sDims = DATA.scene.groups[0].dims;
  state.scene.push(pick(pick([sDims[0], sDims[1]]).chips)[0]);
  state.scene.push(pick(sDims[2].chips)[0]);
  // style: 画面风格/色调/光源/景别 各一个
  const st = DATA.style.groups[0].dims;
  [0,2,3,4].forEach(i => state.style.push(pick(st[i].chips)[0]));
  render();
}

/* clear & copy */
document.getElementById("clearBtn").addEventListener("click", () => {
  clearPresetNote();
  CATS.forEach(c => state[c] = []);
  cp.useCam = cp.usePose = false; syncUse();
  render();
});

function promptText() {
  const sep = plang === "zh" ? "," : ", ";
  const ex = extras(plang);
  return CATS.flatMap(c => [...picked(c).map(w => wordText(w, plang)), ...ex[c]]).join(sep);
}

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = promptText();
  if (!text) { showToast(t("pickFirst")); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast(t("copied"));
  } catch (err) {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast(t("copied")); }
    catch(e) { showToast(t("copyFail")); }
    document.body.removeChild(ta);
  }
});

let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ================= 渲染输出 ================= */
function render() {
  saveState();
  // chips 高亮
  document.querySelectorAll(".chip").forEach(btn => {
    const on = state[btn.dataset.cat].includes(btn.dataset.word);
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on);
    const off = overridden(btn.dataset.cat, btn.dataset.word);
    btn.classList.toggle("by3d", off);
    btn.title = off ? t("by3d") : "";
  });
  // 计数
  CATS.forEach(c => { document.querySelector(`[data-cnt="${c}"]`).textContent = state[c].length; });
  const ex = extras(plang);
  // 完整度
  document.querySelectorAll(".m-dot").forEach(d => d.classList.toggle("ok", picked(d.dataset.cat).length + ex[d.dataset.cat].length > 0));
  // REC 灯
  const total = CATS.reduce((n, c) => n + picked(c).length + ex[c].length, 0);
  document.getElementById("rec").classList.toggle("live", total > 0);
  // 提示词
  const out = document.getElementById("promptOut");
  if (total === 0) {
    out.innerHTML = `<span class="vf-empty">${t("empty")}</span>`;
    return;
  }
  const comma = plang === "zh" ? "," : ", ";
  const parts = [];
  CATS.forEach(c => {
    picked(c).forEach(w => parts.push(`<span class="seg-${c}">${escapeHtml(wordText(w, plang))}</span>`));
    ex[c].forEach(w => parts.push(`<span class="seg-${c} seg-3d">${escapeHtml(w)}</span>`));
  });
  out.innerHTML = parts.join(`<span class="seg-comma">${comma}</span>`);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ================= 语言 ================= */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-cat-name]").forEach(el => { el.textContent = t("cat")[el.dataset.catName]; });
  document.querySelectorAll("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.langBtn === lang));
  renderPanes();
  renderPresets();
  studio.setLang(lang);
  render();
  if (tourIdx >= 0) showTourStep();
}
document.querySelectorAll("[data-lang-btn]").forEach(b => b.addEventListener("click", () => {
  if (lang === b.dataset.langBtn) return;
  lang = b.dataset.langBtn;
  try { localStorage.setItem(LS_LANG, lang); } catch(e) {}
  applyLang();
}));

/* 提示词语言:可以和界面语言不同(大多数工具用英文效果更好) */
function syncPlang() {
  document.querySelectorAll("[data-plang-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.plangBtn === plang));
}
document.querySelectorAll("[data-plang-btn]").forEach(b => b.addEventListener("click", () => {
  plang = b.dataset.plangBtn;
  try { localStorage.setItem(LS_PLANG, plang); } catch(e) {}
  studio.refresh();
  syncPlang();
  render();
}));

/* ================= 日间 / 夜间 ================= */
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function currentTheme() {
  return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
}
function syncThemeButtons() {
  const th = currentTheme();
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === th));
}
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn;
  try { localStorage.setItem(LS_THEME, b.dataset.themeBtn); } catch(e) {}
  syncThemeButtons();
}));
darkQuery.addEventListener("change", syncThemeButtons);
syncThemeButtons();
/* ================= 新手引导 ================= */
const TOUR_TARGETS = [null, "#formula", "#presetRow", "#builder", ".vf-frame", ".plang", "#copyBtn", "#dgGrid"];
const tourEl = document.getElementById("tour");
const tourSpot = document.getElementById("tourSpot");
const tourCard = document.getElementById("tourCard");
const viewfinder = document.querySelector(".viewfinder");
let tourIdx = -1;
let tourOpener = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function tourTarget() {
  const sel = TOUR_TARGETS[tourIdx];
  return sel ? document.querySelector(sel) : null;
}
function startTour() {
  tourOpener = document.activeElement;
  tourIdx = 0;
  tourEl.hidden = false;
  try { localStorage.setItem("promptlab.toured", "1"); } catch(e) {}
  document.getElementById("tourBtn").classList.remove("pulse");
  showTourStep();
}
function endTour() {
  tourEl.hidden = true;
  tourIdx = -1;
  if (tourOpener && tourOpener.focus) tourOpener.focus();
}
function showTourStep() {
  const steps = t("tour");
  const [title, body] = steps[tourIdx];
  document.getElementById("tourStep").textContent = t("tourStepOf").replace("{n}", tourIdx + 1).replace("{total}", steps.length);
  document.getElementById("tourTitle").textContent = title;
  document.getElementById("tourBody").innerHTML = body;
  document.getElementById("tourDots").innerHTML = steps.map((_, i) => `<i class="${i === tourIdx ? "on" : ""}"></i>`).join("");
  const back = document.getElementById("tourBack"), next = document.getElementById("tourNext");
  back.textContent = t("tourBack");
  back.disabled = tourIdx === 0;
  next.textContent = tourIdx === steps.length - 1 ? t("tourFinish") : t("tourNext");
  document.getElementById("tourClose").setAttribute("aria-label", t("close"));
  const el = tourTarget();
  tourEl.classList.toggle("no-target", !el);
  if (el && !viewfinder.contains(el)) {
    // 底部取景器会挡住页面下方,滚动时把目标留在它上面
    el.style.scrollMarginTop = "84px";
    el.style.scrollMarginBottom = (viewfinder.offsetHeight + 16) + "px";
    el.scrollIntoView({behavior: reduceMotion.matches ? "auto" : "smooth", block: window.innerWidth < 640 ? "start" : "center"});
  }
  positionTour();
  setTimeout(positionTour, 350);
  setTimeout(positionTour, 700);
  next.focus();
}
function positionTour() {
  if (tourIdx < 0) return;
  const el = tourTarget();
  if (!el) {
    tourCard.className = "tour-card center";
    tourCard.style.left = tourCard.style.top = "";
    return;
  }
  const inVf = viewfinder.contains(el);
  const pad = 8, topLimit = 64;
  const bottomLimit = inVf ? window.innerHeight - 4 : viewfinder.getBoundingClientRect().top - 4;
  const r = el.getBoundingClientRect();
  const top = Math.max(r.top - pad, topLimit);
  const bottom = Math.min(r.bottom + pad, bottomLimit);
  Object.assign(tourSpot.style, {
    left: (r.left - pad) + "px", top: top + "px",
    width: (r.width + pad * 2) + "px", height: Math.max(0, bottom - top) + "px"
  });
  if (window.innerWidth < 640) {
    tourCard.className = "tour-card sheet" + (inVf ? " top" : "");
    tourCard.style.left = tourCard.style.top = "";
    return;
  }
  tourCard.className = "tour-card";
  const ch = tourCard.offsetHeight, cw = tourCard.offsetWidth;
  let y;
  if (bottomLimit - bottom > ch + 24) y = bottom + 14;
  else if (top - topLimit > ch + 24) y = top - ch - 14;
  else y = topLimit + 12;
  const x = Math.min(Math.max(16, r.left), window.innerWidth - cw - 16);
  tourCard.style.left = x + "px";
  tourCard.style.top = y + "px";
}
function tourGo(delta) {
  const n = tourIdx + delta;
  if (n < 0) return;
  if (n >= t("tour").length) { endTour(); return; }
  tourIdx = n;
  showTourStep();
}
document.getElementById("tourNext").addEventListener("click", () => tourGo(1));
document.getElementById("tourBack").addEventListener("click", () => tourGo(-1));
document.getElementById("tourClose").addEventListener("click", endTour);
document.getElementById("tourBtn").addEventListener("click", startTour);
document.getElementById("guideBtn").addEventListener("click", startTour);
tourEl.addEventListener("click", e => { if (e.target === tourEl) endTour(); });
document.addEventListener("keydown", e => {
  if (tourIdx < 0) return;
  if (e.key === "Escape") endTour();
  else if (e.key === "ArrowRight") tourGo(1);
  else if (e.key === "ArrowLeft") tourGo(-1);
  else if (e.key === "Tab") {
    // 把焦点留在引导卡片里
    const f = [...tourCard.querySelectorAll("button:not(:disabled)")];
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});
let tourRaf = 0;
function onViewportChange() {
  if (tourIdx < 0) return;
  cancelAnimationFrame(tourRaf);
  tourRaf = requestAnimationFrame(positionTour);
}
window.addEventListener("scroll", onViewportChange, {passive:true});
window.addEventListener("resize", onViewportChange);
try { if (!localStorage.getItem("promptlab.toured")) document.getElementById("tourBtn").classList.add("pulse"); } catch(e) {}

syncPlang();
applyLang();
</script>
</body>
</html>
